<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
/* 用量看板挂在 /dashboard 这个路径上。
   静态服务器没有目录索引能力，/dashboard 会被 fallback 到本页（插件中心），
   所以这里先判路径：命中就同步取来看板的 HTML，直接替换整个文档。
   这样地址栏保持干净的 /dashboard，也不会闪一下首页。
   取的时候带时间戳：CDN 会把 /dashboard/index.html 缓存住（部署不会主动失效），
   带上变化的参数才能每次穿透缓存拿到最新版看板。 */
(function () {
  if (location.pathname.replace(/\/+$/, '') !== '/dashboard') return;
  var url = '/dashboard/index.html?t=' + Date.now();
  try {
    var x = new XMLHttpRequest();
    x.open('GET', url, false);
    x.send();
    if (x.status === 200 || x.status === 0) {
      document.open();
      document.write(x.responseText);
      document.close();
      return;
    }
  } catch (e) { /* 落到下面兜底 */ }
  location.replace(url);
})();
</script>
<title>插件中心</title>
<!-- 图标：**真实文件放在 /assets/ 下**，不要用根路径 /favicon.ico ——
     那个路径在「文件还不存在」时被 CDN 缓存成了「回落首页的 HTML」，
     部分边缘节点至今仍返回 HTML，且部署不会让 CDN 失效（换条没被缓存过的路径才稳）。
     ICO 里面含 16~256 七个尺寸；SVG 那行在支持它的浏览器上更清晰，Safari 会跳过它去用 ICO。 -->
<link rel="icon" href="/assets/favicon.ico">
<link rel="shortcut icon" href="/assets/favicon.ico">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='3' y1='3' x2='25' y2='25' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0' stop-color='%238ad0ff'/%3E%3Cstop offset='1' stop-color='%233b6dff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='4' y='4' width='20' height='20' rx='6.6' fill='none' stroke='url(%23g)' stroke-width='3'/%3E%3Crect x='10.6' y='10.6' width='6.8' height='6.8' rx='2.3' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<style>
  :root{
    --bg:#07080b;
    --line:rgba(255,255,255,.075);
    --line-2:rgba(255,255,255,.15);
    --text:#eef2f8;
    --muted:#8a93a4;
    --muted-2:#5f6878;
    --c:#3b9dff;
    --c-rgb:59,157,255;
    --c-text:#3b9dff;   /* 主题色当文字用；日间模式会被换成加深版 */
    --on:#ffffff;
    --wrap:1080px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;overscroll-behavior-x:none;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  /* ---- 背景氛围：跟随当前插件主题色 ---- */
  body::before{
    content:""; position:fixed; left:50%; top:-360px; width:1280px; height:780px;
    transform:translateX(-50%); z-index:0; pointer-events:none; filter:blur(14px);
    background:radial-gradient(closest-side,rgba(var(--c-rgb),.28),transparent 70%);
    transition:background .65s ease;
  }
  body::after{
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(760px 460px at 86% -6%,rgba(var(--c-rgb),.11),transparent 70%);
    transition:background .65s ease;
  }
  .gridbg{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,.026) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.026) 1px,transparent 1px);
    background-size:58px 58px;
    -webkit-mask-image:radial-gradient(820px 520px at 50% 0%,#000,transparent 80%);
    mask-image:radial-gradient(820px 520px at 50% 0%,#000,transparent 80%);
  }
  .wrap{max-width:var(--wrap);margin:0 auto;padding:0 24px;position:relative;z-index:2;}
  a{color:inherit;}

  /* ---- 顶部导航 ---- */
  nav{
    position:sticky; top:0; z-index:30;
    background:rgba(7,8,11,.74); backdrop-filter:blur(16px) saturate(160%);
    border-bottom:1px solid var(--line);
  }
  nav .wrap{display:flex;align-items:center;gap:12px;height:60px;padding:0 24px;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14.5px;letter-spacing:.2px;text-decoration:none;}
  .brand .logo{
    width:26px;height:26px;flex:none;display:grid;place-items:center;
    filter:drop-shadow(0 3px 12px rgba(59,157,255,.55));
  }
  .brand .logo svg{width:26px;height:26px;display:block;}

  /* ---- Hero ---- */
  header.hero{padding:38px 0 20px;}
  /* 说明文字和主标题同一行：左标题、右说明，底对齐；窄屏自动折行 */
  .hero-row{
    display:flex;align-items:flex-end;justify-content:space-between;
    gap:44px;flex-wrap:wrap;
  }
  .lead{color:#98a2b1;font-size:15.5px;margin:0;flex:1 1 320px;max-width:470px;}
  h1{margin:0;flex:0 0 auto;font-size:clamp(30px,3.7vw,43px);line-height:1.2;letter-spacing:-1.3px;font-weight:700;}
  h1 em{
    font-style:normal;
    background:linear-gradient(100deg,#3b9dff,#cf1736 52%,#e6b422);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }

  /* ---- 不规则四边形 Tab ---- */
  .tabbar{padding:8px 0 0;}
  .tabs{display:flex;gap:8px;overflow-x:auto;overscroll-behavior-x:contain;padding:4px 2px 10px;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}

  .tab{
    position:relative;border:0;background:none;padding:0;cursor:pointer;flex:none;
    font-family:inherit;
    /* 必须给一个「透明光晕」当过渡目标，不能留空：
       激活态的彩色投影如果直接过渡到 none，Chrome 会残留一圈旧颜色的描边
       —— 表现就是切走之后，得物那个 tab 原地还留着一圈蓝色。 */
    filter:drop-shadow(0 0 0 rgba(0,0,0,0));
    will-change:filter;
    transition:filter .35s ease,transform .35s ease;
  }
  .tab .edge{
    display:block;padding:1px;
    clip-path:polygon(19px 0,100% 0,calc(100% - 25px) 100%,0 100%);
    background:rgba(255,255,255,.09);
    transition:background .35s ease;
  }
  .tab .face{
    display:flex;align-items:center;gap:9px;
    /* 梯形左右两条斜边不对称：竖中线上左边界在 9px、右边界在 W-12px。
       所以左右 padding 要差 3px（左 = 右 - 3），图标+文字看起来才是居中的。
       原来左 37 / 右 30 差了 7px，内容就偏右了。 */
    padding:13px 35px 13px 32px;
    clip-path:polygon(18px 0,100% 0,calc(100% - 24px) 100%,0 100%);
    background:#12151b;color:#98a2b1;
    font-size:14px;font-weight:600;letter-spacing:.2px;white-space:nowrap;
    transition:background .35s ease,color .35s ease;
  }
  .tab .face svg{width:16px;height:16px;flex:none;opacity:.85;}
  .tab .cnt{
    font-size:10.5px;font-weight:700;letter-spacing:0;padding:1px 6px;border-radius:5px;
    background:rgba(255,255,255,.08);color:var(--muted);transition:background .35s,color .35s;
  }
  .tab:hover .face{background:#181c24;color:#dbe3ee;}
  .tab:hover{filter:drop-shadow(0 10px 20px rgba(0,0,0,.5));}
  .tab.on{filter:drop-shadow(0 14px 30px rgba(var(--trgb),.5));}
  .tab.on .edge{background:linear-gradient(160deg,rgba(255,255,255,.62),rgba(255,255,255,.16));}
  .tab.on .face{background:var(--tc);color:var(--ton);}
  .tab.on .cnt{background:rgba(0,0,0,.22);color:inherit;}
  .tab:focus-visible{outline:2px solid rgba(var(--trgb),.8);outline-offset:3px;}

  /* ---- 内容面板 ---- */
  .stage{padding:0 0 56px;}
  .panel{
    /* 用 clip 而不是 hidden：两者都能把左上角的光晕裁进圆角里，
       但 overflow:hidden 会把面板变成「滚动容器」，里面的 position:sticky
       （在线工具箱的左目录）就再也贴不住视口了 —— clip 不创建滚动容器。
       前一行是给不认 clip 的老浏览器兜底（那种情况下只是目录不跟随，不会坏）。 */
    position:relative;overflow:hidden;overflow:clip;
    border:1px solid var(--line);border-radius:20px;
    background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.012));
    box-shadow:0 46px 90px -58px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.05);
    padding:28px 30px;
    animation:rise .5s cubic-bezier(.2,.7,.3,1) both;
  }
  .panel>*{position:relative;z-index:1;}
  .panel::before{
    content:"";position:absolute;left:0;right:0;top:0;height:1px;z-index:0;
    background:linear-gradient(90deg,transparent,rgba(var(--c-rgb),.95),transparent);
    box-shadow:0 0 20px 1px rgba(var(--c-rgb),.55);
  }
  .panel::after{
    content:"";position:absolute;left:-140px;top:-160px;width:480px;height:360px;
    z-index:0;pointer-events:none;
    background:radial-gradient(closest-side,rgba(var(--c-rgb),.13),transparent 74%);
  }
  @keyframes rise{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}

  .phead{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;}
  .emblem{
    width:66px;height:66px;border-radius:20px;flex:none;display:grid;place-items:center;
    background:linear-gradient(150deg,rgba(var(--c-rgb),1),rgba(var(--c-rgb),.68));
    color:var(--on);
    box-shadow:0 20px 38px -16px rgba(var(--c-rgb),.85),inset 0 1px 0 rgba(255,255,255,.42);
  }
  .emblem svg{width:32px;height:32px;}
  .hmeta{flex:1 1 320px;min-width:0;}
  .hmeta h2{margin:0 0 7px;font-size:27px;letter-spacing:-.7px;font-weight:700;line-height:1.25;}
  .hmeta .tl{color:#a3adbd;font-size:14.5px;margin:0;max-width:620px;}
  .tagrow{display:flex;gap:11px;align-items:center;flex-wrap:wrap;margin-top:13px;font-size:12.5px;color:var(--muted);}
  .dot{width:3px;height:3px;border-radius:50%;background:var(--muted-2);}
  .badge{
    font-size:11.5px;padding:3px 11px;border-radius:999px;font-weight:600;letter-spacing:.2px;
    border:1px solid transparent;
  }
  .badge.on{color:#3ddc97;background:rgba(61,220,151,.12);border-color:rgba(61,220,151,.32);}
  .badge.beta{color:#fbbf24;background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.32);}
  .badge.plan{color:#9aa6b8;background:rgba(154,166,184,.12);border-color:rgba(154,166,184,.3);}
  .act{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;}

  .btn{
    display:inline-flex;align-items:center;gap:9px;border-radius:12px;padding:13px 22px;
    font-size:14.5px;font-weight:600;font-family:inherit;cursor:pointer;text-decoration:none;
    border:1px solid transparent;
    transition:transform .16s ease,box-shadow .28s ease,background .28s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn.primary{
    background:var(--c);color:var(--on);
    box-shadow:0 18px 36px -18px rgba(var(--c-rgb),.95),inset 0 1px 0 rgba(255,255,255,.3);
  }
  .btn.primary:hover{box-shadow:0 22px 44px -18px rgba(var(--c-rgb),1);}
  .btn.primary span{opacity:.7;font-weight:500;}
  .btn.ghost{background:rgba(255,255,255,.05);border-color:var(--line-2);color:var(--text);}
  .btn.ghost:hover{background:rgba(255,255,255,.1);}

  /* ---- 小节 ---- */
  .sec{margin-top:26px;}
  .sec-h{
    display:flex;align-items:baseline;gap:11px;margin:0 0 15px;
    font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:600;
  }
  .sec-h s{text-decoration:none;font-weight:400;letter-spacing:.2px;text-transform:none;font-size:12.5px;color:var(--muted-2);}
  .sec-h::before{content:"";width:16px;height:1px;background:rgba(var(--c-rgb),.8);align-self:center;}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(262px,1fr));gap:11px;}
  .pg{
    border:1px solid var(--line);border-radius:14px;padding:15px 17px;
    background:rgba(255,255,255,.022);
    transition:border-color .25s,background .25s,transform .25s;
  }
  .pg:hover{border-color:rgba(var(--c-rgb),.45);background:rgba(var(--c-rgb),.06);transform:translateY(-2px);}
  .pg .t{font-weight:600;font-size:14px;margin-bottom:5px;letter-spacing:-.1px;}
  .pg .d{color:var(--muted);font-size:12.8px;line-height:1.66;}
  .pg .p{color:var(--c-text);font-size:11.5px;margin-top:9px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}

  .cols{display:grid;grid-template-columns:1.05fr .95fr;gap:34px;margin-top:26px;}
  .cols .sec{margin-top:0;}

  /* ---- 安装步骤 ---- */
  .steps{list-style:none;margin:0;padding:0;counter-reset:s;}
  .steps li{
    counter-increment:s;position:relative;padding:0 0 15px 39px;
    font-size:14px;color:#c2cbd8;line-height:1.72;
  }
  .steps li:last-child{padding-bottom:0;}
  .steps li::before{
    content:counter(s);position:absolute;left:0;top:2px;
    width:25px;height:25px;border-radius:9px;display:grid;place-items:center;
    font-size:11.5px;font-weight:700;
    background:rgba(var(--c-rgb),.14);color:var(--c-text);
    border:1px solid rgba(var(--c-rgb),.32);
  }
  .steps b{color:#eaf0f8;font-weight:600;}
  .steps code,.hint code{
    background:rgba(255,255,255,.075);border:1px solid var(--line);
    padding:1px 7px;border-radius:6px;font-size:12.5px;color:#dbe3ee;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  .hint{
    margin-top:13px;padding:13px 16px;border-radius:12px;
    font-size:13px;line-height:1.75;color:#b4becd;
    background:rgba(var(--c-rgb),.07);border:1px solid rgba(var(--c-rgb),.18);
  }
  .hint b{color:#e8eef7;font-weight:600;}

  /* ---- 更新日志 ---- */
  .log{position:relative;padding-left:18px;}
  .log::before{
    content:"";position:absolute;left:4px;top:9px;bottom:9px;width:1px;
    background:linear-gradient(180deg,rgba(var(--c-rgb),.65),rgba(255,255,255,.06));
  }
  .rel{position:relative;padding:0 0 20px;}
  .rel:last-child{padding-bottom:0;}
  .rel::before{
    content:"";position:absolute;left:-18px;top:7px;width:9px;height:9px;border-radius:50%;
    background:#0b0d12;border:2px solid rgba(255,255,255,.22);
  }
  .rel:first-child::before{
    background:rgb(var(--c-rgb));border-color:rgb(var(--c-rgb));
    box-shadow:0 0 0 4px rgba(var(--c-rgb),.16);
  }
  .rel .hd{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;}
  .rel .v{font-weight:700;font-size:14.5px;letter-spacing:-.1px;}
  .rel .tag{
    font-size:10.5px;font-weight:700;color:var(--on);background:rgb(var(--c-rgb));
    border-radius:5px;padding:1px 7px;vertical-align:1px;
  }
  .rel .date{color:var(--muted-2);font-size:12px;}
  .rel ul{margin:7px 0 0;padding-left:17px;color:#96a0b0;font-size:13.2px;line-height:1.8;}
  .rel ul::marker{color:var(--c-text);opacity:.75;}

  /* ---- 在线工具箱：工具卡片 ---- */
  .tools{display:grid;gap:12px;}
  .tcard{
    border:1px solid var(--line);border-radius:14px;
    background:rgba(255,255,255,.022);
    padding:16px;
  }
  .tc-h{display:flex;align-items:baseline;gap:9px;margin-bottom:13px;}
  .tc-h b{font-size:14.5px;letter-spacing:-.1px;}
  .tc-h span{font-size:12px;color:var(--muted-2);}
  .tc-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:10px;}
  .tc-row .lb{font-size:12px;color:var(--muted-2);flex:none;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{
    font:inherit;font-size:12px;padding:4px 11px;border-radius:8px;cursor:pointer;
    border:1px solid var(--line);background:transparent;color:var(--muted);
    transition:border-color .2s,background .2s,color .2s;
  }
  .chip:hover{border-color:var(--line-2);color:var(--text);}
  .chip.on{
    border-color:rgba(var(--c-rgb),.55);background:rgba(var(--c-rgb),.15);
    color:var(--c-text);font-weight:600;
  }
  .inp{
    font:inherit;font-size:12.5px;width:82px;padding:5px 9px;border-radius:8px;
    border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--text);
    outline:none;transition:border-color .2s;
  }
  .inp:focus{border-color:rgba(var(--c-rgb),.55);}
  .ck{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer;}
  .ck input{accent-color:rgb(var(--c-rgb));width:13px;height:13px;cursor:pointer;margin:0;}
  .io{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:11px;}
  .io-col{display:flex;flex-direction:column;min-width:0;}
  .io-h{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted-2);margin-bottom:6px;}
  .io-h-wide{justify-content:space-between;}
  .io-h-wide.mt{margin-top:15px;}
  .cp{
    margin-left:auto;font:inherit;font-size:11px;padding:2px 9px;border-radius:6px;cursor:pointer;
    border:1px solid var(--line);background:transparent;color:var(--muted);transition:color .2s,border-color .2s;
  }
  .cp:hover{color:var(--text);border-color:var(--line-2);}
  .tcard textarea{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:12.5px;line-height:1.75;
    width:100%;box-sizing:border-box;min-height:116px;resize:vertical;
    padding:10px 12px;border-radius:10px;
    border:1px solid var(--line);background:rgba(0,0,0,.22);color:var(--text);
    outline:none;transition:border-color .2s;
  }
  .tcard textarea:focus{border-color:rgba(var(--c-rgb),.5);}
  .tcard textarea[readonly]{background:rgba(var(--c-rgb),.06);}
  .tcard textarea.wide{min-height:148px;}
  .tnote{
    font-size:12.5px;line-height:1.78;color:var(--muted);
    background:rgba(var(--c-rgb),.07);border:1px solid rgba(var(--c-rgb),.2);
    border-radius:10px;padding:10px 13px;margin-bottom:12px;
  }
  .tnote code{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.8px;
    background:rgba(255,255,255,.07);padding:1px 5px;border-radius:4px;
  }
  .tnote b{color:var(--text);font-weight:600;}
  .out-note{margin:12px 0 0;}
  .cnt{font-variant-numeric:tabular-nums;}
  .cnt.over{color:#ff8080;}
  .btnrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:11px;}
  @media (max-width:720px){ .io{grid-template-columns:1fr;} }

  /* ---- 在线工具箱：左侧二级目录（只有这个面板有） ---- */
  .tool-layout{display:grid;grid-template-columns:126px 1fr;gap:28px;align-items:start;}
  .tool-body{min-width:0;}
  .tool-body .sec:first-child{margin-top:0;}
  /* 纯文字目录：不要背景块、不要边框 —— 一有底块就会和上面的模块"接"在一起 */
  .tool-toc{position:sticky;top:84px;display:flex;flex-direction:column;}
  .tool-toc-t{
    font-size:14px;font-weight:700;letter-spacing:-.1px;
    color:var(--text);padding:0 0 13px;
  }
  .tool-toc a{
    display:block;font-size:14px;color:var(--muted);text-decoration:none;cursor:pointer;
    padding:10px 0;transition:color .2s;
  }
  .tool-toc a:hover{color:var(--text);}
  .tool-toc a.on{color:rgb(var(--c-rgb));font-weight:600;}
  @media (max-width:900px){
    .tool-layout{grid-template-columns:1fr;gap:0;}
    .tool-toc{display:none;}
    .tool-body .sec:first-child{margin-top:26px;}
  }

  /* ---- 回到顶部 ---- */
  .totop{

/* ==============================  渲染  ============================== */

var tabsEl = document.getElementById('tabs');
var viewEl = document.getElementById('view');
var currentId = null;
var firstPaint = true;
var DEFAULT_ID = 'dewu';   /* 打开页面（地址里没带 #/xxx）时默认停在哪个插件 */

function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];
  });
}

function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast on';
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.className = 'toast'; }, 2000);
}

function find(id){
  for (var i = 0; i < PLUGINS.length; i++) if (PLUGINS[i].id === id) return PLUGINS[i];
  return null;
}

/* 把主色按比例调暗：日间模式下拿它当文字色，才压得住白底 */
function deepen(hex, amt){
  function f(i){
    var v = parseInt(hex.slice(i, i + 2), 16);
    return Math.max(0, Math.min(255, Math.round(v * (1 - amt))));
  }
  return 'rgb(' + f(1) + ',' + f(3) + ',' + f(5) + ')';
}

/* 把当前插件的配色写进 CSS 变量，整页（含背景光晕）跟着换色 */
function applyTheme(p){
  var st = document.documentElement.style;
  var light = document.documentElement.getAttribute('data-theme') === 'light';
  st.setProperty('--c', p.color);
  st.setProperty('--c-rgb', p.rgb);
  st.setProperty('--on', p.on);
  st.setProperty('--c-text', light ? deepen(p.color, .34) : p.color);
}

/* ---------------- 日间 / 夜间 ---------------- */
var THEME_KEY = 'pluginhub-theme2';   /* 换过 key：旧版本存过的 dark 不该盖住新的默认值 */

function themeIcon(light){
  return light
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M4.7 4.7l1.6 1.6M17.7 17.7l1.6 1.6M2.6 12h2.2M19.2 12h2.2M4.7 19.3l1.6-1.6M17.7 6.3l1.6-1.6"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1z"/></svg>';
}

function setTheme(mode){
  document.documentElement.setAttribute('data-theme', mode);
  var btn = document.getElementById('themebtn');
  if (btn) btn.innerHTML = themeIcon(mode === 'light');
  var p = find(currentId);
  if (p) applyTheme(p);
  try { localStorage.setItem(THEME_KEY, mode); } catch (e) {}
}

/* ---------------- 不规则四边形 tab ---------------- */
function renderTabs(){
  tabsEl.innerHTML = PLUGINS.map(function(p){
    var on = p.id === currentId;
    return '<button class="tab' + (on ? ' on' : '') + '" data-id="' + p.id + '" role="tab"' +
      ' aria-selected="' + on + '"' +
      ' style="--tc:' + p.color + ';--ton:' + p.on + ';--trgb:' + p.rgb + '">' +
      '<span class="edge"><span class="face">' + ICONS[p.icon] +
        '<span>' + esc(p.short) + '</span>' +
      '</span></span></button>';
  }).join('');
}

/* ---------------- 内容面板 ---------------- */
function renderPanel(p){
  /* 在线工具箱是「打开就能用」的网页工具，没有安装包和安装步骤，
     面板长得和采集插件不一样，走单独一条渲染分支。 */
  if (p.kind === 'tool') { renderToolbox(p); return; }

  var feats = p.pages.map(function(f){
    return '<div class="pg">' +
      '<div class="t">' + esc(f.t) + '</div>' +
      '<div class="d">' + esc(f.d) + '</div>' +
      '<div class="p">' + esc(f.p) + '</div>' +
    '</div>';
  }).join('');

  var steps = p.steps.map(function(s){ return '<li>' + s + '</li>'; }).join('');
  var hints = p.hints.map(function(h){ return '<div class="hint">' + h + '</div>'; }).join('');

  var logs = p.changelog.map(function(r, i){
    return '<div class="rel">' +
      '<div class="hd">' +
        '<span class="v">v' + esc(r.v) + '</span>' +
        (i === 0 ? '<span class="tag">最新</span>' : '') +
        '<span class="date">' + esc(r.d) + '</span>' +
      '</div>' +
      '<ul>' + r.items.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>' +
    '</div>';
  }).join('');

  viewEl.innerHTML =
    '<div class="panel">' +
      '<div class="phead">' +
        '<div class="emblem">' + ICONS[p.icon] + '</div>' +
        '<div class="hmeta">' +
          '<h2>' + esc(p.name) + '</h2>' +
          '<p class="tl">' + esc(p.tagline) + '</p>' +
          '<div class="tagrow">' +
            '<span class="badge ' + p.pill + '">' + esc(p.status) + '</span>' +
            '<span class="dot"></span><span>最新版 v' + esc(p.version) + ' · ' + esc(p.released) + ' 更新</span>' +
            '<span class="dot"></span><span>' + esc(p.site) + '</span>' +
          '</div>' +
          '<div class="act" id="dl">' +
            (p.downloadUrl
              ? '<a class="btn primary" href="' + esc(p.downloadUrl) + '"' + (p.saveAs ? ' download="' + esc(p.saveAs) + '"' : ' download') + ' rel="noopener">下载最新版 <span>v' + esc(p.version) + '</span></a>'
              : '<button class="btn primary" data-dl>下载最新版 <span>v' + esc(p.version) + '</span></button>') +
          '</div>' +
        '</div>' +
      '</div>' +

      '<div class="sec">' +
        '<h3 class="sec-h">' + esc(p.pagesTitle) + '</h3>' +
        '<div class="cards">' + feats + '</div>' +
      '</div>' +

      '<div class="cols">' +
        '<div class="sec" id="how">' +
          '<h3 class="sec-h">' + esc(p.howTitle || '怎么装') + (p.howNote ? ' <s>' + esc(p.howNote) + '</s>' : '') + '</h3>' +
          '<ol class="steps">' + steps + '</ol>' + hints +
        '</div>' +
        '<div class="sec" id="log">' +
          '<h3 class="sec-h">更新日志 <s>只列最近几个版本</s></h3>' +
          '<div class="log">' + logs + '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
}

/* 短链 → 长链：长链前缀（得物 H5 分享页） */
var LONG_PREFIX = 'https://m.dewu.com/m/activity/community-share?trendId=';

/* 从一段文本里抠出所有 http(s) 链接 */
function pickUrls(text){
  var m = text.match(/https?:\/\/[^\s"'<>，,、）)】\]｜|]+/g);
  return m || [];
}

/* 从一条 URL 里取 trendId（已经带 trendId / contentId 的才取得出来；
   纯短链 www.dewu.com/A/xxxx 需要联网解析，纯前端拿不到） */
function trendIdOf(u){
  var m = u.match(/[?&]trendId=([A-Za-z0-9_-]+)/i) ||
          u.match(/[?&]contentId=([A-Za-z0-9_-]+)/i) ||
          u.match(/community-share\/([A-Za-z0-9_-]+)/i);
  return m ? m[1] : null;
}

function bindToolbox(){
  var $ = function(id){ return viewEl.querySelector('#' + id); };

  /* 通用：按选项把文本切成数组 */
  function splitLines(v, trim, noBlank, uniq){
    var a = v.split(/\r?\n/);
    if (trim) a = a.map(function(s){ return s.trim(); });
    if (noBlank) a = a.filter(function(s){ return s !== ''; });
    if (uniq) {
      var seen = {};
      a = a.filter(function(s){ return seen[s] ? false : (seen[s] = true); });
    }
    return a;
  }

  /* ---- 合并 ---- */
  var mgIn = $('mg-in'), mgOut = $('mg-out'), mgSep = $('mg-sep');
  var mgQuote = 'none';
  function mgRun(){
    var arr = splitLines(mgIn.value, $('mg-trim').checked, $('mg-noblank').checked, $('mg-uniq').checked);
    var q = mgQuote === 'none' ? '' : (mgQuote === 'single' ? "'" : '"');
    mgOut.value = arr.map(function(s){ return q + s + q; }).join(mgSep.value);
  }

  /* ---- 拆分 ---- */
  var spIn = $('sp-in'), spOut = $('sp-out'), spSep = $('sp-sep');
  function spRun(){
    var sep = spSep.value === '\\t' ? '\t' : spSep.value;
    if (!sep) { spOut.value = ''; return; }
    var arr = spIn.value.split(sep);
    if ($('sp-trim').checked) arr = arr.map(function(s){ return s.trim(); });
    if ($('sp-noblank').checked) arr = arr.filter(function(s){ return s !== ''; });
    if ($('sp-uniq').checked) {
      var seen = {};
      arr = arr.filter(function(s){ return seen[s] ? false : (seen[s] = true); });
    }
    spOut.value = arr.join('\n');
  }

  /* 绑定：所有输入都实时重算 */
  function onLive(el, fn){ if (el) { el.oninput = fn; el.onchange = fn; } }
  onLive(mgIn, mgRun); onLive(mgSep, mgRun);
  onLive(spIn, spRun); onLive(spSep, spRun);
  ['mg-trim','mg-noblank','mg-uniq'].forEach(function(id){ onLive($(id), mgRun); });
  ['sp-trim','sp-noblank','sp-uniq'].forEach(function(id){ onLive($(id), spRun); });

  /* 预设 / 引号按钮 */
  function chipGroup(wrapId, fn){
    var box = $(wrapId);
    if (!box) return;
    box.onclick = function(e){
      var b = e.target.closest ? e.target.closest('.chip') : null;
      if (!b) return;
      var sib = box.querySelectorAll('.chip');
      for (var i = 0; i < sib.length; i++) sib[i].classList.remove('on');
      b.classList.add('on');
      fn(b);
    };
  }
  chipGroup('mg-preset', function(b){
    if (b.getAttribute('data-q')) {
      mgQuote = b.getAttribute('data-q'); mgSep.value = ',';
      var qs = $('mg-quote').querySelectorAll('.chip');
      for (var i = 0; i < qs.length; i++) {
        qs[i].classList.toggle('on', qs[i].getAttribute('data-v') === 'double');
      }
    } else if (b.getAttribute('data-sep') !== null) {
      mgSep.value = b.getAttribute('data-sep');
    }
    mgRun();
  });
  chipGroup('mg-quote', function(b){ mgQuote = b.getAttribute('data-v'); mgRun(); });
  chipGroup('sp-preset', function(b){ spSep.value = b.getAttribute('data-sep'); spRun(); });

  /* ---- 复制按钮 ---- */
  var cps = viewEl.querySelectorAll('.cp');
  for (var i = 0; i < cps.length; i++) {
    (function(btn){
      btn.onclick = function(){
        var ta = $(btn.getAttribute('data-copy'));
        if (!ta || !ta.value) { toast('还没有内容可复制'); return; }
        copyText(ta.value, function(ok){
          toast(ok ? '已复制' : '复制失败，请手动选中复制');
        });
      };
    })(cps[i]);
  }

  /* ---- 短链转长链 ---- */
  var slIn = $('sl-in'), slOut = $('sl-out'), slCnt = $('sl-cnt'), slN = $('sl-n'), slNote = $('sl-note');
  var shorties = [];   /* 收集解不开的短链，用于提示 */

  function slCount(){
    var n = slIn.value.split(/\r?\n/).filter(function(s){ return s.trim() !== ''; }).length;
    slCnt.textContent = n + '/100 条';
    slCnt.classList.toggle('over', n > 100);
  }
  slIn.oninput = slCount;

  function slRun(){
    var rows = slIn.value.split(/\r?\n/).slice(0, 100);
    var out = [], seen = {}, miss = [];
    rows.forEach(function(line){
      pickUrls(line).forEach(function(u){
        var id = trendIdOf(u);
        if (!id) { if (miss.indexOf(u) < 0) miss.push(u); return; }
        if (seen[id]) return;
        seen[id] = true;
        out.push(LONG_PREFIX + id);
      });
    });
    shorties = miss;
    slOut.value = out.join('\n');
    slN.textContent = out.length;

    /* 解不开的（纯短链）单独提示，别让用户以为工具坏了 */
    if (miss.length) {
      slNote.hidden = false;
      slNote.innerHTML = '<b>有 ' + miss.length + ' 条是短链，没能转换。</b>' +
        '短链要访问得物服务器才能换出 trendId，网页端拿不到——' +
        '目前只能处理已经带 <code>trendId</code> 的链接。';
    } else {
      slNote.hidden = true;
    }
  }
  $('sl-go').onclick = slRun;

  $('sl-copy').onclick = function(){
    if (!slOut.value) { toast('还没有可复制的内容'); return; }
    copyText(slOut.value, function(ok){ toast(ok ? '已复制 ' + slN.textContent + ' 条长链' : '复制失败'); });
  };

  $('sl-xls').onclick = function(){
    if (!slOut.value) { toast('还没有可导出的内容'); return; }
    /* 存成 CSV：Excel 双击即可打开；带 BOM 免得中文乱码 */
    var csv = '\ufeff' + '长链\n' + slOut.value.split('\n').map(function(s){
      return '"' + s.replace(/"/g, '""') + '"';
    }).join('\n');
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'dewu-longlinks.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);
    toast('已导出 ' + slN.textContent + ' 条');
  };

  mgRun(); spRun(); slCount();
}

/* 复制到剪贴板（带降级） */
function copyText(text, cb){
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    cb(ok);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function(){ cb(true); }, fallback);
  } else fallback();
}

/* ---------------- 版本自动同步 ----------------
   配了 versionUrl 的插件，打开页面后后台拉一次线上 version.json，
   成功就替换掉版本号 / 发布日期 / 更新日志（并重绘当前面板），失败就什么都不做。
   页面永远是先用手写的兜底数据渲染出来的，所以断网 / 跨域 / 对方挂了
   都不会影响打开，也不会出现空白或报错。 */
function syncVersion(p){
  if (!p.versionUrl) return;
  var url = p.versionUrl + (p.versionUrl.indexOf('?') < 0 ? '?' : '&') + 't=' + Date.now();
  fetch(url, { cache: 'no-store' })
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(v){
      if (!v || !v.latest) return;
      var updated = false;

      if (String(v.latest) !== String(p.version)) { p.version = String(v.latest); updated = true; }
      if (v.released && v.released !== p.released) { p.released = v.released; updated = true; }

      /* 用 version.json 里的 file 字段拼出最新安装包地址（相对它自己的站点根）。
         ★ 这里原来是 /\/[^\/]*$/ —— 对「version.json」这种**没有斜杠**的路径不匹配，
         整个文件名会被留下，拼出 version.json/dl/xxx.zip 这种 404 地址（实测线上得物那格就是这样）。
         改成只去掉文件名、留下目录（末尾带 /）；在站点根时目录就是空串。 */
      if (v.file) {
        var base = p.versionUrl.replace(/[^\/]*$/, '');
        var dl = base + String(v.file).replace(/^\/+/, '');
        if (dl !== p.downloadUrl) { p.downloadUrl = dl; updated = true; }
      }

      /* saveAs：浏览器「另存为」用的文件名（URL 里仍是 ASCII 名，避开中文路径的 CDN 缓存坑） */
      if (v.saveAs && String(v.saveAs) !== String(p.saveAs)) { p.saveAs = String(v.saveAs); updated = true; }

      if (v.changelog && v.changelog.length) {
        var remote = v.changelog.slice(0, 3).map(function(r){
          return { v: r.version, d: r.date, items: r.items || [] };
        });
        if (JSON.stringify(remote) !== JSON.stringify(p.changelog)) { p.changelog = remote; updated = true; }
      }

      if (updated && p.id === currentId) renderPanel(p);
    })
    .catch(function(e){
      /* 读不到就继续用手写数据；留条 warn 方便排查，页面不受影响 */
      if (window.console) console.warn('[插件中心] ' + p.id + ' 的 version.json 没读到，继续用内置数据：' + e.message);
    });
}

/* ---------------- 交互 ---------------- */
function scrollToStage(){
  var bar = document.querySelector('.tabbar');
  if (!bar) return;
  var top = bar.getBoundingClientRect().top;
  if (top >= 0) return;   /* tab 栏还在视口里，就别动滚动位置 */
  window.scrollTo({ top: Math.max(top + window.pageYOffset - 70, 0), behavior: 'smooth' });
}

function bind(){
  /* 顶栏 logo 点击回到第一个插件；同样不写 URL、不压历史 */
  var brand = document.querySelector('.brand');
  if (brand) brand.onclick = function(e){ e.preventDefault(); render('dewu'); };

  var dl = viewEl.querySelector('[data-dl]');
  if (dl) dl.onclick = function(){ toast('Demo 阶段：安装包下载链接待接入'); };
}

/* 切 tab 走 replaceState，不往历史栈里塞记录。
   mac 上双指左右滑 = 浏览器前进 / 后退手势，如果每次切 tab 都 push 一条历史，
   滑一下就会顺着历史误切页面。 */
tabsEl.addEventListener('click', function(e){
  var btn = e.target.closest ? e.target.closest('.tab') : null;
  if (!btn) return;
  var id = btn.getAttribute('data-id');
  if (id && id !== currentId) render(id);
});

/* ---------------- 路由 ---------------- */
function render(id){
  var p = find(id) || find(DEFAULT_ID) || PLUGINS[0];

  /* 这里刻意不写 location.hash、也不 pushState / replaceState。
     原因：mac 上双指左右滑是浏览器的「前进 / 后退」手势，它翻的是**历史记录**。
     只要页面内部一条历史都不产生，这个手势就没有目标可去，也就不会把页面切走。
     所以切 tab 只改内存里的状态，URL 从头到尾不动。
     （仍然支持打开时带 #/xxx 直达某个插件，见下面的 route） */
  currentId = p.id;
  applyTheme(p);
  renderTabs();
  renderPanel(p);
  bind();

  if (firstPaint) { window.scrollTo(0, 0); firstPaint = false; }
  else scrollToStage();
}

function route(){ render(decodeURIComponent(location.hash.replace(/^#\/?/, ''))); }

/* 初始化：先把主题定下来（优先 URL 上的 ?theme=，其次上次的选择），再渲染 */
(function(){
  var saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
  var q = location.search.match(/[?&]theme=(light|dark)/);
  if (q) saved = q[1];
  setTheme(saved === 'dark' ? 'dark' : 'light');   /* 默认日间 */
})();

document.getElementById('themebtn').onclick = function(){
  var now = document.documentElement.getAttribute('data-theme');
  setTheme(now === 'light' ? 'dark' : 'light');
};

window.addEventListener('hashchange', route);
route();

/* ---------------- 回到顶部 + 工具箱目录 ----------------
   一个全局滚动监听搞定两件事：
   · 滚过一屏后显示右下角的回顶按钮
   · 工具箱面板的左目录跟着高亮当前所在的区块
   （onScroll 只注册一次；切 tab 后目录不存在就自然跳过） */
var totopEl = document.getElementById('totop');
if (totopEl) totopEl.onclick = function(){ window.scrollTo({ top: 0, behavior: 'smooth' }); };

var TOC_SECS = ['tf', 'sl', 'log'];
function onScroll(){
  if (totopEl) totopEl.classList.toggle('on', window.pageYOffset > 380);

  var toc = document.getElementById('tool-toc');
  if (!toc) return;

  var cur = TOC_SECS[0];
  for (var i = 0; i < TOC_SECS.length; i++) {
    var el = document.getElementById(TOC_SECS[i]);
    if (el && el.getBoundingClientRect().top <= 150) cur = TOC_SECS[i];
  }
  var links = toc.querySelectorAll('a');
  for (var j = 0; j < links.length; j++) {
    links[j].classList.toggle('on', links[j].getAttribute('data-sec') === cur);
  }
}
window.addEventListener('scroll', onScroll, { passive: true });
onScroll();

/* 目录点击 → 滚到对应区块（留出顶栏的高度） */
document.addEventListener('click', function(e){
  var a = e.target.closest ? e.target.closest('#tool-toc a') : null;
  if (!a) return;
  var el = document.getElementById(a.getAttribute('data-sec'));
  if (!el) return;
  var y = el.getBoundingClientRect().top + window.pageYOffset - 96;
  window.scrollTo({ top: Math.max(y, 0), behavior: 'smooth' });
});

/* 打开后静默同步各插件的线上版本信息（只有配了 versionUrl 的才会发请求） */
PLUGINS.forEach(syncVersion);
</script>
